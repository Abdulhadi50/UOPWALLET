<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherFlow - تطبيق </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #f0b90b;
            --primary-light: #3a3a3a;
            --secondary: #f0b90b;
            --dark: #1e1e1e;
            --light: #ffffff;
            --gray: #b0b0b0;
            --gradient: linear-gradient(135deg, #f0b90b 0%, #ffdf60 100%);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'segoe ui', tahoma, geneva, verdana, sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            margin: 0 auto 20px;
            box-shadow: var(--shadow);
            border: 4px solid var(--primary-light);
            animation: float 3s ease-in-out infinite;
            background-size: cover;
            background-position: center;
            background-image: url('https://up6.cc/2025/10/176434412515061.jpg');
        }

        @keyframes float {
            0%, 100% { transform: translatey(0); }
            50% { transform: translatey(-10px); }
        }

        .app-title {
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 5px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-company {
            font-size: 1.1em;
            color: var(--gray);
            margin-bottom: 15px;
        }

        .app-tagline {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 25px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9em;
            color: var(--gray);
            margin-top: 5px;
        }

        .rating {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .stars {
            color: var(--secondary);
            margin-left: 8px;
        }

        .rating-value {
            font-weight: 700;
            font-size: 1.1em;
            color: var(--light);
        }

        .install-button {
            background: var(--gradient);
            color: white;
            padding: 16px 35px;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 700;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(240, 185, 11, 0.3);
        }

        .install-button:hover {
            transform: translatey(-3px);
            box-shadow: 0 12px 25px rgba(240, 185, 11, 0.4);
        }

        .install-button i {
            margin-left: 10px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        footer {
            margin-top: 30px;
            color: var(--gray);
            font-size: 0.9em;
            text-align: center;
        }

        @media (max-width: 480px) {
            .app-title { font-size: 2em; }
            .stats { gap: 20px; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="app-icon"></div>

        <h1 class="app-title">AetherFlow</h1>
        <div class="app-company">Syr App</div>

        <div class="app-tagline"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value">35 MB</div>
                <div class="stat-label">الحجم</div>
            </div>
            <div class="stat">
                <div class="stat-value">4.8</div>
                <div class="stat-label">التقييم</div>
            </div>
            <div class="stat">
                <div class="stat-value">7K+</div>
                <div class="stat-label">التنزيلات</div>
            </div>
        </div>

        <div class="rating">
            <div class="rating-value">4.8</div>
            <div class="stars">
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star-half-alt"></i>
            </div>
        </div>

        <a href="https://apk.e-droid.net/apk/app3827156-uhklpd.apk?v=1" class="install-button" target="_blank">
            <i class="fas fa-download"></i>
            تنزيل التطبيق
        </a>

        <div class="features"></div>

    </div>

    <footer>
        &copy; 2026 AetherFlow - Syr App. جميع الحقوق محفوظة
    </footer>
</body>
</html>
